<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - UseLicecroche</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .admin-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 40px;
        }
        .admin-form input {
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .admin-form button {
            padding: 10px;
            font-size: 1rem;
            background: var(--navy-blue);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .admin-form button:hover {
            background: var(--text-dark);
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        .list-item img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 5px;
        }
        .list-item-btn {
            background: red;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        .header-link {
            text-align: center;
            margin-top: 20px;
        }
        .header-link a {
            color: var(--navy-blue);
            text-decoration: none;
            font-weight: bold;
        }
        .preview-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .preview-item {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 5px;
            overflow: hidden;
            border: 2px solid var(--gold-accent);
        }
        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .preview-remove {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(255, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2 style="text-align: center; margin-bottom: 20px;">Painel de Administração</h2>
        
        <form class="admin-form" id="admin-form">
            <h3>Adicionar Novo Produto</h3>
            <input type="text" id="p-name" placeholder="Nome do Produto" required>
            <input type="number" id="p-price" placeholder="Preço (ex: 99.90)" step="0.01" required>
            
            <textarea id="p-desc" placeholder="Descrição do Produto (ficará ao lado da imagem)" rows="3" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-family: inherit;"></textarea>
            <textarea id="p-details" placeholder="Detalhes Adicionais (Materiais, Tamanhos, Prazo...)" rows="2" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-family: inherit;"></textarea>
            
            <div style="display: flex; gap: 15px; align-items: center;">
                <div style="flex: 1;">
                    <label style="font-weight: 600; color: var(--navy-blue); display: block; margin-bottom: 5px;">Categoria:</label>
                    <select id="p-category" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-family: inherit; background: white;">
                        <option value="Bolsas">Bolsas</option>
                        <option value="Vestidos">Vestidos</option>
                        <option value="Tops">Tops</option>
                        <option value="Biquíni">Biquíni</option>
                    </select>
                </div>
                <div style="flex: 1; display: flex; align-items: center; gap: 10px; margin-top: 25px;">
                    <input type="checkbox" id="p-is-news" style="width: 20px; height: 20px;">
                    <label for="p-is-news" style="font-weight: 600; color: var(--navy-blue);">Marcar como Novidade</label>
                </div>
            </div>

            
            <label style="font-weight: 600; margin-top: 10px; color: var(--navy-blue);">Imagens do Produto:</label>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <input type="file" id="p-image-file" accept="image/*" style="flex: 1; padding: 5px;" multiple onchange="handleImageUpload(event)">
                <span style="align-self: center; font-weight: bold; color: #888;">OU</span>
                <input type="text" id="p-image" placeholder="Cole URLs separadas por vírgula" style="flex: 1;">
            </div>
            <!-- Campo escondido que guarda o código Base64 da imagem se tiver upload -->
            <input type="hidden" id="p-image-base64">

            <div id="p-image-preview" class="preview-container"></div>

            <button type="submit" style="margin-top: 15px;">Adicionar Produto</button>
        </form>

        <div id="admin-products-list">
            <!-- Products will be listed here -->
        </div>

        <div class="header-link">
            <a href="index.html">&larr; Voltar para a Loja</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, remove } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";
        import firebaseConfig from "./firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let productsList = [];

        document.addEventListener("DOMContentLoaded", () => {
            loadAdminProducts();
            document.getElementById('admin-form').addEventListener('submit', addProduct);
        });

        function loadAdminProducts() {
            const productsRef = ref(db, 'products');
            onValue(productsRef, (snapshot) => {
                const data = snapshot.val();
                productsList = [];
                if (data) {
                    productsList = Object.keys(data).map(key => ({
                        id: key,
                        ...data[key]
                    }));
                }
                
                renderAdminList();
            });
        }

        function renderAdminList() {
            const list = document.getElementById('admin-products-list');
            list.innerHTML = '<h3>Produtos Cadastrados</h3><hr style="margin-bottom: 10px;">';
            
            if (productsList.length === 0) {
                list.innerHTML += '<p style="text-align: center; color: #888;">Nenhum produto cadastrado no banco de dados.</p>';
            }

            productsList.forEach((p) => {
                let firstImg = (p.images && p.images.length > 0) ? p.images[0] : '';
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                        <img src="${firstImg}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/50'">
                        <div style="flex: 1; margin-left: 15px;">
                            <h4 style="margin:0">${p.name}</h4>
                                <span style="color:var(--gold-accent);font-weight:bold;">R$ ${Number(p.price).toFixed(2).replace('.', ',')}</span>
                                <br><small style="color:#888;">
                                    ${p.category || 'Sem Categoria'} | 
                                    ${p.isNews ? '✨ Novidade' : 'Normal'} | 
                                    ${p.images ? p.images.length : 1} foto(s)
                                </small>
                            </div>
                            <button class="list-item-btn" onclick="removeProduct('${p.id}')">Remover</button>
                `;
                list.appendChild(div);
            });
        }

        let pendingImages = [];

        async function compressImage(base64Str) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 500; // Tamanho ideal para catálogo rápido
                    const MAX_HEIGHT = 500;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Compressão Turbo (40% de qualidade) para reduzir o peso ao mínimo
                    resolve(canvas.toDataURL('image/jpeg', 0.4));
                };
            });
        }

        window.handleImageUpload = async (event) => {
            const files = event.target.files;
            if (!files || files.length === 0) return;
            
            const submitBtn = document.querySelector('button[type="submit"]');
            const originalBtnText = submitBtn.innerText;
            submitBtn.disabled = true;
            submitBtn.innerText = "Processando fotos...";

            for (let file of Array.from(files)) {
                const reader = new FileReader();
                const base64 = await new Promise(resolve => {
                    reader.onload = e => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
                
                const compressed = await compressImage(base64);
                pendingImages.push(compressed);
            }
            
            renderPendingImages();
            submitBtn.disabled = false;
            submitBtn.innerText = originalBtnText;
            event.target.value = '';
        };

        function renderPendingImages() {
            const container = document.getElementById('p-image-preview');
            container.innerHTML = '';
            
            pendingImages.forEach((img, index) => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                div.innerHTML = `
                    <img src="${img}">
                    <button type="button" class="preview-remove" onclick="removePendingImage(${index})">&times;</button>
                `;
                container.appendChild(div);
            });
        }

        window.removePendingImage = (index) => {
            pendingImages.splice(index, 1);
            renderPendingImages();
        };

        async function addProduct(e) {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerText = "Salvando no Banco...";

            const name = document.getElementById('p-name').value;
            const price = parseFloat(document.getElementById('p-price').value);
            const description = document.getElementById('p-desc').value;
            const details = document.getElementById('p-details').value;
            const category = document.getElementById('p-category').value;
            const isNews = document.getElementById('p-is-news').checked;

            if (pendingImages.length === 0 && !document.getElementById('p-image').value.trim()) {
                alert("Adicione pelo menos uma imagem.");
                submitBtn.disabled = false;
                submitBtn.innerText = "Adicionar Produto";
                return;
            }

            try {
                let finalImages = [];
                
                if (pendingImages.length > 0) {
                    finalImages = [...pendingImages];
                } else {
                    let urlText = document.getElementById('p-image').value.trim();
                    finalImages = urlText.split(',').map(u => u.trim()).filter(u => u.length > 0);
                }

                const productsRef = ref(db, 'products');
                await push(productsRef, { 
                    name, 
                    price, 
                    images: finalImages, 
                    description, 
                    details, 
                    category, 
                    isNews 
                });
                
                document.getElementById('admin-form').reset();
                pendingImages = [];
                renderPendingImages();
                alert("Produto adicionado com sucesso!");
            } catch (err) {
                console.error(err);
                alert("Erro ao salvar. Verifique se as Regras do Realtime Database estão como 'true'.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Adicionar Produto";
            }
        }

        window.removeProduct = async (id) => {
            if (confirm("Remover este produto permanentemente?")) {
                try {
                    const productRef = ref(db, `products/${id}`);
                    await remove(productRef);
                } catch (err) {
                    alert("Erro ao remover.");
                }
            }
        };
    </script>
</body>
</html>
